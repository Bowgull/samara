# Samara's ship gate: every change runs on a Mac and on Windows, and no push carries a secret.
# A release is only made when all of these pass.
name: Samara tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner -v
  samara:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      # The engine itself (castLabs) is not needed by these tests, so install scripts are skipped.
      - name: Libraries
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type check
        run: npx tsc -p . --noEmit
      - name: Unit tests
        run: node --no-warnings --test --test-force-exit --test-timeout=30000 test/*.test.ts
  # Real windows (Phase 0, 2026-11-24): test/electron/ci-checks.txt, the checks that open real Samara windows off
  # screen. Linux under a virtual screen is the gate: all of them passed there twice before this was added. The Mac and
  # Windows runs report but do not block yet; once they are green for a week, drop their continue-on-error.
  windows:
    name: real windows (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Libraries
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Only Electron's own download runs, never another package's install script. The castLabs engine is not
      # needed: the checks run on stock Electron of the same major.
      - name: Electron
        run: node node_modules/electron/install.js
      - name: Virtual screen
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb
      - name: Real-window checks
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a node tools/run-electron-checks.mjs --jobs 3
          else node tools/run-electron-checks.mjs --jobs 2; fi
      # Phase 5: start, memory per page, idle processor and tab switch, against speed-budgets.json. Alone, after the
      # other checks (which run three at a time and would slow it), and even when one of them failed.
      - name: Speed budget
        if: success() || failure()
        run: |
          echo speed-check.ts > "$RUNNER_TEMP/speed.txt"
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a node tools/run-electron-checks.mjs "$RUNNER_TEMP/speed.txt" --jobs 1 --no-retry
          else node tools/run-electron-checks.mjs "$RUNNER_TEMP/speed.txt" --jobs 1 --no-retry; fi
